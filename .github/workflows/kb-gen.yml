name: KB Generation

on:
  workflow_dispatch:
    inputs:
      depth:
        description: 'Scan depth (shallow or deep)'
        required: true
        default: 'deep'
        type: choice
        options:
          - shallow
          - deep
      budget:
        description: 'Budget cap in USD'
        required: true
        default: '15'
        type: string
      promote:
        description: 'Auto-promote entries to CONFIRMED'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  kb-gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          # Ensure claude is findable by the fleet server's shell
          which claude
          ln -sf $(which claude) /usr/local/bin/claude 2>/dev/null || true

      - name: Install apra-fleet
        run: |
          npm install -g @apralabs/apra-fleet
          apra-fleet install

      - name: Install kb-gen workflow from repo
        run: |
          mkdir -p ~/.apra-fleet/workflows/kb-gen
          cp .fleet/workflows/kb-gen/* ~/.apra-fleet/workflows/kb-gen/

      - name: Start fleet server
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: |
          # Fleet server must inherit the OAuth token so dispatched claude sessions are authenticated
          CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN apra-fleet run &
          sleep 5
          curl -sf http://localhost:7523/health || (echo "Fleet server failed to start" && exit 1)

      - name: Register CI member
        id: register
        run: |
          OUTPUT=$(apra-fleet register-member --name ci-scanner --path ${{ github.workspace }} --type local 2>&1)
          echo "$OUTPUT"
          # Extract member UUID from the register output
          MEMBER_ID=$(echo "$OUTPUT" | grep -oP 'ID:\s+\K[a-f0-9-]+')
          echo "member_id=$MEMBER_ID" >> "$GITHUB_OUTPUT"
          echo "Extracted member ID: $MEMBER_ID"

      - name: Register fleet MCP endpoint for dispatched agents
        run: |
          # The interactive bootstrap is disabled in register-member, so we must
          # manually register the apra-fleet-member MCP server so dispatched
          # agent sessions can access kb_capture, kb_query, etc.
          MEMBER_ID="${{ steps.register.outputs.member_id }}"
          FLEET_MCP_URL="http://127.0.0.1:7523/mcp?member=${MEMBER_ID}"

          echo "Registering apra-fleet-member MCP at: $FLEET_MCP_URL"

          # Register at project scope so it's available in the workspace
          claude mcp add \
            --transport http \
            --scope project \
            apra-fleet-member \
            "$FLEET_MCP_URL"

          echo "MCP endpoint registered for dispatched agents"

      - name: Provision LLM auth for CI member
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_SETUP_TOKEN }}
        run: apra-fleet auth --oauth --member ci-scanner "$CLAUDE_CODE_OAUTH_TOKEN"

      - name: Run kb-gen workflow
        run: |
          PROMOTE_FLAG=""
          if [ "${{ inputs.promote }}" = "false" ]; then
            PROMOTE_FLAG="--no-promote"
          fi

          apra-fleet workflow kb-gen \
            --member ci-scanner \
            --depth ${{ inputs.depth }} \
            --budget ${{ inputs.budget }} \
            $PROMOTE_FLAG

      - name: Commit and push KB bible
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f ".fleet/kb-canonical.json" ]; then
            git add .fleet/kb-canonical.json
            git diff --cached --quiet || git commit -m "chore(kb): update canonical bible [skip ci]"
            git push origin HEAD
          else
            echo "No bible generated (no CONFIRMED entries?)"
          fi
